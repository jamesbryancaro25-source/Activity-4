<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Luxury Hotel - Business Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="cards">

            <!-- FRONT OF BUSINESS CARD -->
            <div class="business-card front-card">

                <div class="front-content">
                    <img
                        src="assets/logo.png"
                        alt="The Luxury Hotel Logo"
                        class="front-logo"
                    >
                </div>

            </div>


            <!-- BACK OF BUSINESS CARD -->
            <div class="business-card back-card">

                <!-- Name and contact information -->
                <div class="back-top">

                    <div class="contact-info">

                        <h2>
                            JAMES BRYAN G. CARO
                            <span>CEO</span>
                        </h2>

                        <div class="contact-row">
                            <div class="icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M3 5h18v14H3z"></path>
                                    <path d="m3 6 9 7 9-7"></path>
                                </svg>
                            </div>

                            <span>jamesbryancaro2004@gmail.com</span>
                        </div>

                        <div class="contact-row">
                            <div class="icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M6.6 2.8 4 4.5c-.8.5-1.1 1.5-.8 2.4 2 6.2 7.7 11.9 13.9 13.9.9.3 1.9 0 2.4-.8l1.7-2.6-4.1-3.1-2 1.7c-2.2-1.1-4.4-3.3-5.5-5.5l1.7-2z"></path>
                                </svg>
                            </div>

                            <span>09815932931</span>
                        </div>

                        <div class="contact-row">
                            <div class="icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"></path>
                                    <circle cx="12" cy="9" r="2.5"></circle>
                                </svg>
                            </div>

                            <span>Rizal Street, Lupon, Davao Oriental</span>
                        </div>

                        <div class="contact-row">
                            <div class="icon">
                                <svg viewBox="0 0 24 24">
                                    <path d="M4 4h16v16H4z"></path>
                                    <path d="M8 10v6"></path>
                                    <path d="M8 7.5v.1"></path>
                                    <path d="M12 16v-3.5a2.5 2.5 0 0 1 5 0V16"></path>
                                    <path d="M12 12.5V16"></path>
                                </svg>
                            </div>

                            <span>www.facebook.com/jamesbryan</span>
                        </div>

                    </div>

                </div>


                <!-- Hotel logo -->
                <div class="back-right">

                    <img
                        src="assets/logo.png"
                        alt="The Luxury Hotel"
                        class="back-logo"
                    >

                </div>


                <!-- QR Code -->
                <img
                    src="assets/qr.png"
                    alt="QR Code"
                    class="qr"
                >

            </div>

        </div>

    </main>

</body>
</html>
